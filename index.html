
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Watch Video</title>
<style>
body{margin:0;background:#101116;color:#fff;font-family:Arial,sans-serif;padding:16px}
.wrap{max-width:650px;margin:24px auto;text-align:center}
h2{font-size:23px;line-height:1.5}
.thumb{position:relative;display:block;border-radius:12px;overflow:hidden}
.thumb img{display:block;width:100%;height:auto}
.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#f01828;width:76px;height:54px;border-radius:13px;display:grid;place-items:center}
.play:after{content:"";border-top:12px solid transparent;border-bottom:12px solid transparent;border-left:19px solid white;margin-left:5px}
.btn{display:block;padding:15px;margin:18px 0;border-radius:8px;background:#f01828;color:#fff;text-decoration:none;font-weight:bold}
#continue{background:#168b50}
#timer{font-size:19px;font-weight:bold;margin:18px 0}
.note{color:#c5c5cc;font-size:14px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <h2>ভিডিও দেখতে নিচে ক্লিক করুন</h2>

  <a class="thumb"
     href="https://pinklink3.blogspot.com/2026/10/blog-post.html"
     aria-label="ভিডিও পেজ খুলুন">
    <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhF8hOkw8Wctc5lNZec6jjC6A0CzpkHlQb-x4Gzcq_rTihAqc7pzt4IiroVYCozyrLWTEOgq-cD77vPVhd6RckE2vBzoUG5oS2aEUmqxnz0-R9MZ8VzUbWIqeFPHG5c9y-5iMO0vvGIZ3YZ3WcYmvH0jaHBOfMsbH1xSSoE3OVT-CTeK4-q-9qbPDS_onKc/s320/Screenshot_2026-10-17-02-49-03-340_com.miui.gallery_1792183756129edit.jpg"
         alt="ভিডিও থাম্বনেইল">
    <span class="play"></span>
  </a>

  <a class="btn"
     href="https://pinklink3.blogspot.com/2026/10/blog-post.html">
    ▶ প্রথম ভিডিও পেজ খুলুন
  </a>

  <p class="note">পরবর্তী গন্তব্যে যেতে ১০ সেকেন্ড অপেক্ষা করুন।</p>
  <div id="timer">১০ সেকেন্ড</div>

  <a id="continue" class="btn"
     href="https://uplcm.com/4/12049753"
     hidden>
    Continue to Destination →
  </a>

  <p class="note">Continue বাটনে ক্লিক করলে পরবর্তী পেজ খুলবে।</p>
</div>

<script>
let seconds = 10;
const timer = document.getElementById("timer");
const button = document.getElementById("continue");

const countdown = setInterval(() => {
  seconds--;
  timer.textContent = seconds > 0
    ? seconds + " সেকেন্ড বাকি"
    : "এখন এগিয়ে যেতে পারো";

  if (seconds <= 0) {
    clearInterval(countdown);
    button.hidden = false;
  }
}, 1000);
</script>
</body>
</html>
